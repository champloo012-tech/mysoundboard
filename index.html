<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ・DJサウンドボード</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      font-size: 1.4rem;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.5);
      margin-bottom: 20px;
    }
    .dj-booth {
      background: #1e1e1e;
      border: 4px solid #333;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    /* 曲変更ファイル選択エリア */
    .file-select-box {
      width: 100%;
      background: #151515;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .file-select-box label {
      font-size: 0.8rem;
      color: #aaa;
    }
    .file-select-box input[type="file"] {
      font-size: 0.85rem;
      color: #00ffcc;
    }
    /* ターンテーブル部分 */
    .turntable-container {
      position: relative;
      width: 220px;
      height: 220px;
      background: #2b2b2b;
      border-radius: 50%;
      border: 6px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      cursor: pointer;
      user-select: none;
    }
    .record {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #111 30%, #222 31%, #111 35%, #000 60%);
      border-radius: 50%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .record.spinning {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .label {
      width: 75px;
      height: 75px;
      background: #ff3366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 0.75rem;
      border: 2px dashed #fff;
      text-align: center;
      padding: 2px;
      overflow: hidden;
    }
    /* コントロールエリア */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #151515;
      padding: 12px;
      border-radius: 8px;
    }
    .controls label {
      font-size: 0.85rem;
      color: #aaa;
    }
    .controls input[type=range] {
      width: 100%;
      accent-color: #00ffcc;
    }
    /* 効果音パッド */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }
    .sound-btn {
      background: linear-gradient(135deg, #333, #222);
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      padding: 12px 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }
    .sound-btn:active {
      transform: scale(0.95);
      background: #00ffcc;
      color: #121212;
      box-shadow: 0 0 15px #00ffcc;
    }
  </style>
</head>
<body>

  <h1>MIX DJ BOOTH</h1>

  <div class="dj-booth">
    <!-- 曲の変更（アップロード）用フォーム -->
    <div class="file-select-box">
      <label for="audioFile">メイン音源を変更 (MP3/WAV等):</label>
      <input type="file" id="audioFile" accept="audio/*" onchange="loadNewAudio(event)">
    </div>

    <!-- ターンテーブル -->
    <div class="turntable-container" onclick="toggleTurntable()">
      <div class="record" id="recordDisk">
        <div class="label" id="labelName">TAP TO<br>PLAY</div>
      </div>
    </div>

    <!-- ピッチコントロール -->
    <div class="controls">
      <label for="speedRate">再生スピード (ピッチ): <span id="speedVal">1.0</span>x</label>
      <input type="range" id="speedRate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="changeSpeed(this.value)">
    </div>

    <!-- 効果音パッド -->
    <div class="pad-grid">
      <button class="sound-btn" onclick="playEffect('sound1.mp3')">SE 1</button>
      <button class="sound-btn" onclick="playEffect('sound2.mp3')">SE 2</button>
      <button class="sound-btn" onclick="playEffect('sound3.mp3')">SE 3</button>  
      <button class="sound-btn" onclick="playEffect('sound4.mp3')">SE 4</button>
      <button class="sound-btn" onclick="playEffect('sound5.mp3')">SE 5</button>
            <button class="sound-btn" onclick="playEffect('sound6.mp3')">SE 6</button>
                  <button class="sound-btn" onclick="playEffect('sound7.mp3')">SE 7</button>
    </div>
  </div>

  <script>
    let turntableAudio = new Audio();
    let isPlaying = false;
    const recordDisk = document.getElementById('recordDisk');
    const speedVal = document.getElementById('speedVal');
    const labelName = document.getElementById('labelName');

    // スマホから選択した音声ファイルを読み込む
    function loadNewAudio(event) {
      const file = event.target.files[0];
      if (file) {
        // 既存の再生をストップ
        if (isPlaying) {
          turntableAudio.pause();
          isPlaying = false;
          recordDisk.classList.remove('spinning');
        }
        // オブジェクトURLを作成してオーディオにセット
        const fileURL = URL.createObjectURL(file);
        turntableAudio.src = fileURL;
        turntableAudio.loop = true;
        
        // ラベルにファイル名を表示（長い場合は省略）
        let displayName = file.name.length > 10 ? file.name.substring(0, 10) + '...' : file.name;
        labelName.innerHTML = displayName;
      }
    }

    // ターンテーブルの再生・停止
    function toggleTurntable() {
      if (!turntableAudio.src) {
        alert("先に上のフォームから音楽ファイルを選択してください！");
        return;
      }

      if (!isPlaying) {
        turntableAudio.play().then(() => {
          isPlaying = true;
          recordDisk.classList.add('spinning');
        }).catch(err => console.log("再生エラー:", err));
      } else {
        turntableAudio.pause();
        turntableAudio.currentTime = 0;
        isPlaying = false;
        recordDisk.classList.remove('spinning');
      }
    }

    // スピード変更
    function changeSpeed(val) {
      turntableAudio.playbackRate = val;
      speedVal.innerText = val;
    }

    // 効果音の再生
    function playEffect(filename) {
      const se = new Audio(filename);
      se.currentTime = 0;
      se.play().catch(err => console.log("SEエラー:", err));
    }
  </script>
</body>
</html>
